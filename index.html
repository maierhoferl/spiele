<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsere Spiele</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    background: linear-gradient(135deg, #ffe29f, #ffa99f 50%, #a0e9ff);
    color: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    box-sizing: border-box;
  }
  h1 { font-size: clamp(2rem, 7vw, 3.5rem); margin: 0 0 32px; text-align: center; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 20px; width: 100%; max-width: 520px; }
  a {
    display: flex; align-items: center; gap: 16px;
    padding: 24px; border-radius: 20px;
    background: #fff; color: inherit; text-decoration: none;
    font-size: 1.5rem; font-weight: 700;
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
    transition: transform .1s;
  }
  a:hover, a:focus-visible { transform: translateY(-3px) scale(1.02); }
  a:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .icon { width: 64px; height: 64px; flex: none; border-radius: 12px; }
  .chflag { background: linear-gradient(#fff,#fff) center/62% 19% no-repeat, linear-gradient(#fff,#fff) center/19% 62% no-repeat, #d52b1e; }
  .pixel { image-rendering: pixelated; }
</style>
</head>
<body>
  <h1>🎮 Unsere Spiele</h1>
  <ul>
    <li><a href="https://maierhoferl.github.io/lorenz_welt/"><span class="icon chflag"></span>Lorenz' Welt</a></li>
    <li><a href="https://adrians-grosse-welt.pages.dev/"><img class="icon pixel" src="https://adrians-grosse-welt.pages.dev/icon-180.png" alt="">Adrians Grosse Welt</a></li>
    <!-- ponytail: App Store link; iOS shows "Öffnen" there if installed. Direct app launch needs a URL scheme/universal link in the app -->
    <li><a href="https://apps.apple.com/app/id6758241652"><img class="icon" src="https://lorenzmaierhofer.com/grimasso/favicon.png" alt="">Grimasso</a></li>
    <li><a href="https://maierhoferl.github.io/rohrwelt/"><img class="icon" src="https://maierhoferl.github.io/rohrwelt/favicon.svg" alt="">Rohrwelt</a></li>
  </ul>
</body>
</html>
